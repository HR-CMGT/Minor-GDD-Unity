<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Lecture Feedback • HR Minor GDD</title>
    <link rel="icon" type="image/jpeg" href="HR_Logo.jpg">
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        :root {
            --hr-red: #d60042;
            --hr-red-hover: #b50036;
            --bg-dark: #090c14;
            --card-bg: #111726;
            --card-border: #1e293b;
            --text-title: #f8fafc;
            --text-body: #cbd5e1;
            --text-muted: #64748b;
            --amber-alert: #f59e0b;
            --green-ok: #10b981;
            --blue-info: #0284c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            user-select: none;
        }

        .feedback-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Header */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-left: 4px solid var(--hr-red);
            border-radius: 10px;
            padding: 14px 18px;
        }

        .header-title {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--text-title);
        }

        .header-sub {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .conn-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 9999px;
            background: #0f172a;
            border: 1px solid #334155;
            color: var(--text-muted);
        }

        .conn-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #64748b;
        }

        .conn-dot.online {
            background: #10b981;
            box-shadow: 0 0 8px #10b981;
        }

        /* Big Action Button: Too Fast */
        .btn-too-fast {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(245, 158, 11, 0.3);
            transition: all 0.15s ease;
            width: 100%;
        }

        .btn-too-fast:active {
            transform: scale(0.97);
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.5);
        }

        .btn-too-fast.cooldown {
            background: #1e293b;
            color: #64748b;
            box-shadow: none;
            cursor: not-allowed;
            border: 1px solid #334155;
        }

        .action-tag {
            font-size: 0.75rem;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: rgba(0, 0, 0, 0.2);
            padding: 3px 8px;
            border-radius: 4px;
        }

        .action-text {
            font-size: 1.35rem;
            font-weight: 900;
            letter-spacing: -0.3px;
            text-transform: uppercase;
        }

        .action-hint {
            font-size: 0.82rem;
            opacity: 0.9;
            font-weight: 500;
        }

        /* Secondary Grid */
        .secondary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-secondary {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            color: var(--text-title);
            transition: all 0.15s ease;
        }

        .btn-secondary:active {
            transform: scale(0.97);
            border-color: var(--hr-red);
        }

        .btn-secondary.active-good {
            border-color: var(--green-ok);
            background: rgba(16, 185, 129, 0.1);
        }

        .btn-secondary.active-question {
            border-color: var(--blue-info);
            background: rgba(2, 132, 199, 0.1);
        }

        .btn-secondary span.sec-title {
            font-size: 0.92rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .btn-secondary span.sec-desc {
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        /* Status Toast */
        .status-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 0.82rem;
            color: var(--text-body);
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 44px;
        }

        .status-msg {
            color: #94a3b8;
        }

        .status-msg.sent {
            color: #38bdf8;
            font-weight: 700;
        }

        /* Room Pill */
        .room-bar {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            padding: 8px;
        }
    </style>
</head>
<body>
    <div class="feedback-container">
        <!-- Header -->
        <header>
            <div>
                <div class="header-title">Live Lecture Feedback</div>
                <div class="header-sub">Hogeschool Rotterdam • Minor GDD</div>
            </div>
            <div class="conn-pill" id="connPill">
                <span class="conn-dot" id="connDot"></span>
                <span id="connText">Connecting...</span>
            </div>
        </header>

        <!-- Primary Action: Going Too Fast -->
        <button class="btn-too-fast" id="btnTooFast" onclick="sendFeedback('too_fast')">
            <span class="action-tag">Pacing Alert</span>
            <span class="action-text">Too Fast / Slow Down</span>
            <span class="action-hint" id="tooFastHint">Tap to flag presenter in real time</span>
        </button>

        <!-- Secondary Actions -->
        <div class="secondary-grid">
            <button class="btn-secondary" id="btnGoodPace" onclick="sendFeedback('good_pace')">
                <span class="sec-title" style="color: #10b981;">Pace Is Good</span>
                <span class="sec-desc">Current speed is clear</span>
            </button>

            <button class="btn-secondary" id="btnQuestion" onclick="sendFeedback('question')">
                <span class="sec-title" style="color: #38bdf8;">Question</span>
                <span class="sec-desc">Request clarification</span>
            </button>
        </div>

        <!-- Feedback status alert -->
        <div class="status-box">
            <span class="status-msg" id="statusMsg">Connected. Tap a button to send anonymous feedback.</span>
        </div>

        <!-- Room info -->
        <div class="room-bar">
            Room: <strong id="roomLabel" style="color: #f1f5f9;">basics1</strong> • Anonymous & Private
        </div>
    </div>

    <script>
        // Setup Room & Student ID
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || 'basics1';
        document.getElementById('roomLabel').textContent = roomId;

        let studentId = sessionStorage.getItem('gdd_student_id');
        if (!studentId) {
            studentId = 'std_' + Math.random().toString(36).substring(2, 9);
            sessionStorage.setItem('gdd_student_id', studentId);
        }

        // MQTT Connection
        const topic = `hr-cmgt/gdd/${roomId}/feedback`;
        const brokerUrl = 'wss://broker.emqx.io:8084/mqtt';
        
        let client = null;
        let isConnected = false;
        let cooldownTimer = null;

        function connectMQTT() {
            const clientId = 'std_' + Math.random().toString(16).substring(2, 8);
            try {
                client = mqtt.connect(brokerUrl, {
                    clientId: clientId,
                    clean: true,
                    connectTimeout: 5000,
                    reconnectPeriod: 3000
                });

                client.on('connect', () => {
                    isConnected = true;
                    document.getElementById('connDot').classList.add('online');
                    document.getElementById('connText').textContent = 'Live';
                });

                client.on('offline', () => {
                    isConnected = false;
                    document.getElementById('connDot').classList.remove('online');
                    document.getElementById('connText').textContent = 'Offline';
                });

                client.on('error', (err) => {
                    console.warn('MQTT connection error:', err);
                });
            } catch (e) {
                console.error('MQTT failed init:', e);
            }
        }

        function sendFeedback(type) {
            if (!client || !isConnected) {
                document.getElementById('statusMsg').textContent = 'Connecting to lecture room... please retry.';
                return;
            }

            const payload = JSON.stringify({
                type: type,
                studentId: studentId,
                timestamp: Date.now()
            });

            client.publish(topic, payload, { qos: 0 });

            const statusEl = document.getElementById('statusMsg');
            statusEl.classList.add('sent');

            if (type === 'too_fast') {
                statusEl.textContent = 'Pacing mark (Too Fast) sent to presenter.';
                startCooldown(15);
            } else if (type === 'good_pace') {
                statusEl.textContent = 'Pace confirmation sent to presenter.';
                highlightTemporary('btnGoodPace', 'active-good');
            } else if (type === 'question') {
                statusEl.textContent = 'Question notification sent to presenter.';
                highlightTemporary('btnQuestion', 'active-question');
            }

            setTimeout(() => {
                statusEl.classList.remove('sent');
            }, 3500);
        }

        function startCooldown(seconds) {
            const btn = document.getElementById('btnTooFast');
            const hint = document.getElementById('tooFastHint');
            btn.classList.add('cooldown');
            btn.disabled = true;

            let remaining = seconds;
            hint.textContent = `Mark active (${remaining}s cooldown)`;

            clearInterval(cooldownTimer);
            cooldownTimer = setInterval(() => {
                remaining--;
                if (remaining <= 0) {
                    clearInterval(cooldownTimer);
                    btn.classList.remove('cooldown');
                    btn.disabled = false;
                    hint.textContent = 'Tap to flag presenter in real time';
                } else {
                    hint.textContent = `Mark active (${remaining}s cooldown)`;
                }
            }, 1000);
        }

        function highlightTemporary(btnId, className) {
            const btn = document.getElementById(btnId);
            btn.classList.add(className);
            setTimeout(() => btn.classList.remove(className), 2000);
        }

        // Initialize connection
        connectMQTT();
    </script>
</body>
</html>
