<head>

    <style>
        :root {
            --hr-red: #e20049;
            --hr-darkred: #b8003b;
            --bg-stage: #121214;
            --bg-slide: #ffffff;
            --text-dark: #1e293b;
            --text-light: #f8fafc;
            --accent-new: #10b981;
            --accent-old: #f43f5e;
            --code-bg: #1e1e24;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-stage);
            color: var(--text-light);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Bar */
        .top-bar {
            height: 54px;
            background: #1c1c20;
            border-bottom: 1px solid #2e2e36;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 100;
        }

        .brand-title {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hr-tag {
            background: var(--hr-red);
            color: #fff;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 800;
        }

        .toggle-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #282830;
            padding: 4px 12px;
            border-radius: 9999px;
            border: 1px solid #3e3e48;
        }

        .toggle-text {
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: color 0.2s ease;
            color: #888896;
        }

        .toggle-text.active-old {
            color: var(--accent-old);
        }

        .toggle-text.active-new {
            color: var(--accent-new);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--accent-old);
            transition: .3s;
            border-radius: 22px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-new);
        }

        input:checked + .slider:before {
            transform: translateX(22px);
        }

        /* Workspace layout */
        .main-workspace {
            flex-grow: 1;
            display: flex;
            position: relative;
            height: calc(100vh - 54px - 50px);
        }

        /* Slide Drawer */
        .slide-drawer {
            width: 220px;
            background: #18181c;
            border-right: 1px solid #2e2e36;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 12px;
        }

        .drawer-item {
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 6px;
            overflow: hidden;
            background: #000;
            position: relative;
            aspect-ratio: 16/9;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

        .drawer-item:hover {
            transform: scale(1.03);
            border-color: #555566;
        }

        .drawer-item.active {
            border-color: var(--hr-red);
        }

        .drawer-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .drawer-num {
            position: absolute;
            bottom: 4px;
            left: 4px;
            background: rgba(0,0,0,0.75);
            color: #fff;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 3px;
        }

        /* Slide Stage */
        .stage-area {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #0d0d10;
        }

        .slide-viewport {
            width: 100%;
            max-width: 1050px;
            aspect-ratio: 16 / 9;
            background: #000000;
            border-radius: 12px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        /* Original 1920x1080 HD Slide Image */
        #originalSlideImg {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: #000;
        }

        /* Interactive View (Revised Slide) */
        .view-interactive {
            width: 100%;
            height: 100%;
            background: #f8fafc;
            color: var(--text-dark);
            padding: 40px 50px;
            display: none;
            flex-direction: column;
            overflow-y: auto;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 10;
        }

        .view-interactive.active {
            display: flex;
        }

        /* Slide Banner & Headers */
        .slide-banner {
            background: var(--hr-red);
            color: #fff;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 18px;
            display: inline-block;
            align-self: flex-start;
        }

        .slide-content-text {
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .callout-box {
            background: rgba(16, 185, 129, 0.08);
            border-left: 5px solid var(--accent-new);
            padding: 12px 18px;
            border-radius: 6px;
            margin-top: auto;
            font-size: 0.92rem;
            color: #065f46;
        }

        .callout-title {
            font-weight: 800;
            margin-bottom: 4px;
            color: var(--accent-new);
            text-transform: uppercase;
            font-size: 0.78rem;
            letter-spacing: 0.5px;
        }

        pre {
            background: var(--code-bg);
            color: #38bdf8;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.88rem;
            line-height: 1.45;
            overflow-x: auto;
            margin: 10px 0;
        }

        .footer-logo {
            position: absolute;
            bottom: 16px;
            right: 26px;
            font-weight: 900;
            font-size: 0.85rem;
            color: var(--hr-red);
            opacity: 0.8;
            letter-spacing: 0.5px;
        }

        /* Bottom Controls */
        .bottom-bar {
            height: 50px;
            background: #1c1c20;
            border-top: 1px solid #2e2e36;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            z-index: 100;
        }

        .nav-btn {
            background: #2a2a32;
            color: #f1f5f9;
            border: 1px solid #444452;
            padding: 8px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .nav-btn:hover:not(:disabled) {
            background: #3c3c48;
            border-color: #666678;
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .slide-counter {
            font-size: 0.85rem;
            font-weight: 700;
            color: #94a3b8;
        }

        .mode-indicator {
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 4px;
        }

        .mode-indicator.old {
            background: rgba(244, 63, 94, 0.2);
            color: var(--accent-old);
            border: 1px solid var(--accent-old);
        }

        .mode-indicator.new {
            background: rgba(16, 185, 129, 0.2);
            color: var(--accent-new);
            border: 1px solid var(--accent-new);
        }
    </style>
</head>

                rationale: "Original Keynote slide 20 was completely blank. Now provides concise, working code for collectible pickup detection."
            },
            // Slide 21 (Matches Help Discord)
            {
                banner: "Help, Discord & Troubleshooting",
                content: `<p style="font-size: 1.2rem; font-weight: 700; margin-bottom: 12px;">Need assistance?</p>
                          <ul style="margin-left: 24px; line-height: 1.8;">
                            <li>Ask in the <strong>#dev-help</strong> channel on Discord.</li>
                            <li>Consult <a href="../00_unity.md" style="color:var(--hr-red); font-weight:bold;">00_unity.md</a> for quick reference.</li>
                            <li>Check <a href="../00_codesnippets.md" style="color:var(--hr-red); font-weight:bold;">00_codesnippets.md</a> for verified code snippets.</li>
                          </ul>`,
                rationale: "Direct links to internal course documentation and student help channels."
            }
        ];

        let currentSlide = 0;
        let isNewMode = false;

        function init() {
            const drawer = document.getElementById("slideDrawer");
            drawer.innerHTML = "";

            slideIds.forEach((id, index) => {
                const item = document.createElement("div");
                item.className = `drawer-item ${index === 0 ? 'active' : ''}`;
                item.id = `drawer-${index}`;
                item.onclick = (e) => {
                    e.stopPropagation();
                    goToSlide(index);
                };

                const img = document.createElement("img");
                img.src = `assets/${id}/slide_hd.png`;
                img.alt = `Slide ${index + 1}`;

                const num = document.createElement("span");
                num.className = "drawer-num";
                num.textContent = `${index + 1}`;

                item.appendChild(img);
                item.appendChild(num);
                drawer.appendChild(item);
            });

            updateView();
        }

        function handleToggle() {
            const switchEl = document.getElementById("modeSwitch");
            isNewMode = switchEl.checked;
            updateModeDisplay();
        }

        function setMode(mode) {
            isNewMode = mode;
            document.getElementById("modeSwitch").checked = mode;
            updateModeDisplay();
        }

        function updateModeDisplay() {
            const labelOld = document.getElementById("labelOld");
            const labelNew = document.getElementById("labelNew");
            const interactiveSlide = document.getElementById("interactiveSlide");
            const modeBadge = document.getElementById("modeBadge");

            if (isNewMode) {
                labelOld.classList.remove("active-old");
                labelNew.classList.add("active-new");
                interactiveSlide.classList.add("active");
                modeBadge.textContent = "Revised Unity 6 (6000.x)";
                modeBadge.className = "mode-indicator new";
            } else {
                labelOld.classList.add("active-old");
                labelNew.classList.remove("active-new");
                interactiveSlide.classList.remove("active");
                modeBadge.textContent = "Original Keynote (HD)";
                modeBadge.className = "mode-indicator old";
            }

            renderCurrentSlide();
        }

        function goToSlide(index) {
            if (index < 0 || index >= slideIds.length) return;

            document.getElementById(`drawer-${currentSlide}`).classList.remove("active");
            currentSlide = index;
            document.getElementById(`drawer-${currentSlide}`).classList.add("active");

            document.getElementById(`drawer-${currentSlide}`).scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            document.getElementById("prevBtn").disabled = (currentSlide === 0);
            document.getElementById("nextBtn").disabled = (currentSlide === slideIds.length - 1);
            document.getElementById("slideCounter").textContent = `Slide ${currentSlide + 1} / ${slideIds.length}`;

            renderCurrentSlide();
        }

        function renderCurrentSlide() {
            const slideId = slideIds[currentSlide];

            // 1. Update Original Slide to Crystal Clear Full HD 1920x1080 PNG
            const img = document.getElementById("originalSlideImg");
            img.src = `assets/${slideId}/slide_hd.png`;

            // 2. Update Revised slide contents dynamically for all 21 slides
            const revised = revisedSlides[currentSlide];
            if (revised) {
                document.getElementById("revisedBanner").textContent = revised.banner;
                document.getElementById("revisedContent").innerHTML = revised.content;
                document.getElementById("revisedRationale").textContent = revised.rationale;
            }
        }

        function changeSlide(direction) {
            goToSlide(currentSlide + direction);
        }

        function updateView() {
            updateModeDisplay();
            goToSlide(0);
        }

        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft") {
                changeSlide(-1);
            } else if (e.key === "ArrowRight") {
                changeSlide(1);
            } else if (e.key === " ") {
                e.preventDefault();
                setMode(!isNewMode);
            }
        });

        init();
    </script>
</body>
</html>
